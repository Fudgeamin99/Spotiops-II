<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spotiops II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=Saira+Stencil+One&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: tactical HUD. Gunmetal panels framed by orange corner brackets, a faint ranging grid behind the hero, mono readouts for every number; one column + mini player + tab bar on phones. */
:root {
  --bg: #06080a;
  --panel: #0d1114;
  --panel-2: #141a1e;
  --panel-3: #1c2429;
  --line: #27313a;
  --grid: rgba(120, 150, 155, .07);
  --fg: #e6ebe8;
  --muted: #8a979c;
  --dim: #56626a;
  --accent: #ff7a1a;
  --accent-hi: #ff9847;
  --accent-ink: #140800;
  --accent-soft: rgba(255, 122, 26, .12);
  --danger: #ff5045;
  --hero: #26303a;
  --font-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-stencil: "Saira Stencil One", "Chakra Petch", "Arial Black", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --cut: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--font-body);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select { font: inherit; color: inherit; }
a { color: inherit; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.i { flex: none; display: block; }
.link { cursor: pointer; }
.link:hover { text-decoration: underline; text-decoration-color: var(--accent); color: var(--fg); }
.muted { color: var(--muted); }
.tnum { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* shared devices */
.cut { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.brackets, .box, .login-card, .modal-card {
  --bk: var(--accent); --bl: 14px;
  background:
    linear-gradient(var(--bk), var(--bk)) top left / var(--bl) 2px no-repeat,
    linear-gradient(var(--bk), var(--bk)) top left / 2px var(--bl) no-repeat,
    linear-gradient(var(--bk), var(--bk)) bottom right / var(--bl) 2px no-repeat,
    linear-gradient(var(--bk), var(--bk)) bottom right / 2px var(--bl) no-repeat,
    var(--panel);
}

/* ---------- Login ---------- */
#login {
  height: 100%; overflow: auto; display: grid; place-items: center;
  padding: 24px 16px;
  background:
    radial-gradient(45% 40% at 50% 0%, rgba(255,122,26,.16), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
    var(--bg);
}
.login-card {
  width: 100%; max-width: 420px; display: grid; gap: 20px;
  border: 1px solid var(--line); padding: 32px 28px; --bl: 22px;
}
.login-card .eyebrow { color: var(--accent); }
.login-card h1 { font: 700 28px/1.1 var(--font-display); margin: 6px 0 0; text-transform: uppercase; text-wrap: balance; letter-spacing: .01em; }
.login-card p { margin: 0; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field label { font: 12px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.field input, .field select {
  background: var(--bg); border: 1px solid var(--line); border-radius: 0;
  padding: 12px 14px; outline: none; width: 100%;
}
.field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: var(--accent-ink);
  font: 700 15px var(--font-display); text-transform: uppercase; letter-spacing: .1em;
  padding: 12px 24px; transition: background .12s;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}
.btn:hover { background: var(--accent-hi); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.ghost { background: var(--panel-3); color: var(--fg); }
.btn.ghost:hover { background: #26303a; }
.err { color: var(--danger); font-size: 14px; min-height: 1em; }
.brand { display: flex; align-items: center; gap: 10px; font: 400 20px/1 var(--font-stencil); letter-spacing: .06em; text-transform: uppercase; }
.brand b { font-weight: 400; color: var(--accent); }
.brand .mark { width: 30px; height: 30px; flex: none; }

/* ---------- App shell ---------- */
#app {
  height: 100%; display: grid; gap: 8px; padding: 8px; position: relative;
  grid-template-columns: var(--side-w, 300px) minmax(0, 1fr) auto;
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "side main right" "player player player";
}
#app::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 20;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
}
.box { border: 1px solid var(--line); --bl: 12px; }
.side { grid-area: side; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.nav { padding: 18px 12px 10px; display: grid; gap: 2px; }
.nav .brand { padding: 0 12px 14px; }
.nav-item {
  display: flex; align-items: center; gap: 16px; padding: 10px 12px;
  font: 600 15px var(--font-display); text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); transition: color .12s, background .12s; position: relative;
}
.nav-item:hover { color: var(--fg); }
.nav-item.on { color: var(--fg); background: linear-gradient(90deg, var(--accent-soft), transparent); }
.nav-item.on::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: var(--accent); }
.lib { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.lib-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.lib-head h2 { margin: 0; display: flex; align-items: center; gap: 12px; font: 600 15px var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.icon-btn {
  width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted);
  transition: color .12s, background .12s;
}
.icon-btn:hover { color: var(--fg); background: var(--panel-3); }
.icon-btn.on { color: var(--accent); }
.chips { display: flex; gap: 6px; padding: 4px 16px 8px; flex-wrap: wrap; }
.chip {
  padding: 6px 12px; background: var(--panel-3);
  font: 12px var(--font-mono); text-transform: uppercase; letter-spacing: .1em;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  transition: background .12s, color .12s;
}
.chip:hover { background: #27313a; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.lib-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px 6px 16px; }
.lib-filter { display: flex; align-items: center; gap: 6px; color: var(--muted); flex: 1; min-width: 0; border-bottom: 1px solid var(--line); }
.lib-filter:focus-within { border-color: var(--accent); }
.lib-filter input { background: transparent; border: 0; outline: none; width: 100%; padding: 6px 0; font-size: 14px; }
.sortbtn { font: 12px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 4px; }
.sortbtn:hover { color: var(--accent); }
.lib-list { flex: 1; overflow: auto; padding: 4px 8px 8px; scrollbar-color: var(--line) transparent; }
.li {
  display: grid; grid-template-columns: 48px minmax(0,1fr); gap: 12px; align-items: center;
  padding: 6px 8px; cursor: pointer; position: relative;
}
.li:hover { background: var(--panel-2); }
.li.on { background: var(--panel-3); }
.li.on::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--accent); }
.li .t { font-weight: 600; }
.li .s { font-size: 13px; color: var(--muted); }
.li.playing .t { color: var(--accent); }
.thumb { width: 48px; height: 48px; overflow: hidden; background: var(--panel-3); }
.thumb.round { border-radius: 50%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.ph {
  width: 100%; height: 100%; display: grid; place-items: center; color: hsl(var(--h,25) 70% 62%);
  background:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 12px 12px,
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 12px 12px,
    linear-gradient(135deg, hsl(var(--h,25) 20% 20%), #0c1013);
}
.liked-art {
  color: var(--accent-ink);
  background: repeating-linear-gradient(-45deg, var(--accent) 0 12px, #e8650c 12px 24px);
}

/* ---------- Main ---------- */
main {
  grid-area: main; position: relative; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); scrollbar-color: var(--line) transparent;
}
.topbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
  padding: 14px 24px; transition: background .2s, border-color .2s; border-bottom: 1px solid transparent;
}
.topbar.solid { background: color-mix(in srgb, var(--hero) 45%, var(--panel)); border-color: var(--line); }
.circle {
  width: 32px; height: 32px; display: grid; place-items: center;
  background: rgba(0,0,0,.5); color: var(--fg); border: 1px solid var(--line);
}
.circle:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.circle:disabled { opacity: .35; cursor: default; }
.searchbox {
  flex: 1; max-width: 400px; display: flex; align-items: center; gap: 10px;
  background: var(--bg); border: 1px solid var(--line); padding: 0 14px; height: 44px;
}
.searchbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.searchbox input { flex: 1; background: none; border: 0; outline: none; min-width: 0; font-size: 15px; }
.top-right { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.uplink { font: 12px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; max-width: 260px; }
.uplink::before { content: ""; width: 7px; height: 7px; flex: none; background: #4cd28a; box-shadow: 0 0 8px #4cd28a; animation: blink 2.4s steps(1) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.avatar {
  width: 34px; height: 34px; background: var(--accent); color: var(--accent-ink);
  font: 700 15px var(--font-display); display: grid; place-items: center;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}
#view { padding: 0 24px 40px; position: relative; }
.hero-bg {
  position: absolute; inset: 0 0 auto 0; height: 440px; pointer-events: none;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(180deg, var(--hero) 0%, color-mix(in srgb, var(--hero) 30%, var(--panel)) 60%, var(--panel) 100%);
  -webkit-mask-image: linear-gradient(#000 70%, transparent);
  mask-image: linear-gradient(#000 70%, transparent);
  transition: background .4s;
}
main > .topbar, #view > * { position: relative; }

.greet {
  font: 700 clamp(22px, 3vw, 32px)/1.1 var(--font-display); margin: 8px 0 20px;
  text-transform: uppercase; letter-spacing: .03em;
}
.greet::before { content: "> "; color: var(--accent); }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; margin-bottom: 32px; }
.qt {
  display: flex; align-items: center; gap: 12px; height: 56px; padding-right: 8px;
  background: rgba(255,255,255,.05); border: 1px solid var(--line); overflow: hidden; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.qt:hover { background: rgba(255,255,255,.09); border-color: rgba(255,122,26,.5); }
.qt .thumb { width: 56px; height: 56px; flex: none; }
.qt .t { font: 600 14px var(--font-display); text-transform: uppercase; letter-spacing: .03em; flex: 1; }
.qt .playfab { width: 36px; height: 36px; opacity: 0; transform: none; position: static; }
.qt:hover .playfab, .qt .playfab.live { opacity: 1; }

.shelf { margin-bottom: 30px; }
.shelf-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.shelf-head h2 { margin: 0; font: 700 19px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .05em; text-wrap: balance; }
.shelf-head h2::before { content: "// "; color: var(--accent); font-family: var(--font-mono); font-weight: 400; }
.shelf-head button { font: 12px var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.shelf-head button:hover { color: var(--accent); }
.row-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 180px); gap: 4px; overflow-x: auto; margin: 0 -12px; padding: 0 0 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px; margin: 0 -12px; }
.card { padding: 12px; cursor: pointer; transition: background .15s; min-width: 0; }
.card:hover { background: var(--panel-2); }
.card .art { position: relative; aspect-ratio: 1; max-width: 100%; overflow: hidden; background: var(--panel-3); margin-bottom: 10px; box-shadow: 0 10px 24px rgba(0,0,0,.5); }
.card .art.round { border-radius: 50%; }
.card .art img { width: 100%; height: 100%; object-fit: cover; }
.card .art:not(.round)::after {
  content: ""; position: absolute; inset: 6px; pointer-events: none; opacity: 0; transition: opacity .15s, inset .15s;
  --bk: var(--accent); --bl: 16px;
  background:
    linear-gradient(var(--bk), var(--bk)) top left / var(--bl) 2px no-repeat,
    linear-gradient(var(--bk), var(--bk)) top left / 2px var(--bl) no-repeat,
    linear-gradient(var(--bk), var(--bk)) top right / var(--bl) 2px no-repeat,
    linear-gradient(var(--bk), var(--bk)) top right / 2px var(--bl) no-repeat,
    linear-gradient(var(--bk), var(--bk)) bottom left / var(--bl) 2px no-repeat,
    linear-gradient(var(--bk), var(--bk)) bottom left / 2px var(--bl) no-repeat;
}
.card:hover .art::after { opacity: 1; inset: 8px; }
.card .t { font-weight: 700; }
.card .s { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.playfab {
  width: 48px; height: 48px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  transition: opacity .2s, transform .2s, background .12s;
}
.playfab:hover { background: var(--accent-hi); }
.card .playfab { position: absolute; right: 8px; bottom: 8px; opacity: 0; transform: translateY(8px); z-index: 1; }
.card:hover .playfab, .card .playfab.live { opacity: 1; transform: none; }

/* entity header */
.ent { display: flex; align-items: flex-end; gap: 24px; padding: 24px 0; flex-wrap: wrap; }
.ent .cover { position: relative; width: clamp(150px, 20vw, 232px); aspect-ratio: 1; overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,.6); flex: none; background: var(--panel-3); max-width: 100%; outline: 1px solid rgba(255,255,255,.08); outline-offset: 6px; }
.ent .cover.round { border-radius: 50%; outline: none; }
.ent .cover img { width: 100%; height: 100%; object-fit: cover; }
.ent .meta { min-width: 0; flex: 1 1 280px; display: grid; gap: 10px; }
.eyebrow { font: 13px var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.eyebrow::before { content: "[ "; } .eyebrow::after { content: " ]"; }
.ent h1 {
  margin: 0; font: 400 clamp(32px, 5.5vw, 78px)/.95 var(--font-stencil); letter-spacing: .01em;
  text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere;
  text-shadow: 0 2px 24px rgba(0,0,0,.45);
}
.ent h1.long { font-size: clamp(26px, 3.6vw, 48px); line-height: 1; }
.ent .by { font: 13px var(--font-mono); letter-spacing: .04em; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; color: rgba(230,235,232,.75); text-transform: uppercase; }
.ent .by b { color: var(--fg); font-weight: 400; }
.ent .overview { color: rgba(230,235,232,.72); font-size: 15px; max-width: 65ch; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.actions { display: flex; align-items: center; gap: 18px; padding: 8px 0 20px; }
.actions .playfab { width: 58px; height: 58px; }
.actions .icon-btn { width: 40px; height: 40px; }

/* track list */
.tl-head, .row {
  display: grid; align-items: center; gap: 16px; padding: 0 16px;
  grid-template-columns: 28px minmax(0, 4fr) minmax(0, 3fr) 32px 52px 32px;
}
.tl-head { height: 36px; color: var(--muted); font: 12px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid var(--line); margin-bottom: 8px; position: sticky; top: 72px; background: var(--panel); z-index: 2; }
.tl-head.noalbum, .row.noalbum { grid-template-columns: 28px minmax(0, 1fr) 32px 52px 32px; }
.row { height: 56px; cursor: pointer; transition: background .1s; }
.row:hover { background: rgba(255,255,255,.05); box-shadow: inset 2px 0 0 var(--line); }
.row.playing { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.row .n { color: var(--dim); text-align: right; font-family: var(--font-mono); position: relative; }
.row .n .pi { display: none; color: var(--fg); }
.row:hover .n .num { display: none; }
.row:hover .n .pi { display: block; margin-left: auto; }
.row .ti { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row .ti .thumb { width: 40px; height: 40px; }
.row .ti .tt { min-width: 0; }
.row .name { font-weight: 600; font-size: 15px; }
.row .sub { font-size: 13px; color: var(--muted); }
.row .alb { font-size: 13px; color: var(--muted); }
.row .dur { color: var(--muted); font: 13px var(--font-mono); text-align: right; }
.row .fav, .row .more { opacity: 0; width: 32px; height: 32px; }
.row:hover .fav, .row:hover .more, .row .fav.on { opacity: 1; }
.fav.on { color: var(--accent); }
.row.unavail { opacity: .35; }
.dl-art { color: var(--accent); background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 10px 10px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 10px 10px, linear-gradient(135deg, #3a1f08, #0c1013); }
.dlbtn.on { color: var(--accent); }
.dlring { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) var(--pct), var(--line) 0); }
.dlring span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); color: var(--fg); font: 9px var(--font-mono); }
.offline-note { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 8px 0 4px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); font: 13px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; }
.uplink.off::before { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.dlm { display: inline-block; vertical-align: -2px; margin-right: 6px; color: var(--accent); }
.dlm .i { display: inline-block; }
.row.playing .name, .row.playing .num { color: var(--accent); }
.eq { display: none; gap: 2px; height: 14px; align-items: flex-end; justify-content: flex-end; }
.eq i { width: 3px; background: var(--accent); animation: eq 1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0%,100% { height: 3px } 50% { height: 14px } }
.row.playing.live .n .num { display: none; }
.row.playing.live .n .eq { display: flex; }
.row.playing.live:hover .n .eq { display: none; }
.disc { display: flex; align-items: center; gap: 12px; padding: 18px 16px 8px; color: var(--muted); font: 12px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }
.foot-note { color: var(--muted); font: 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 20px 16px 0; }

.artist-hero { margin: 0 -24px; padding: 0 24px; min-height: 340px; display: flex; align-items: flex-end; background-size: cover; background-position: center 25%; position: relative; filter: saturate(.85); }
.artist-hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,8,10,0) 25%, rgba(6,8,10,.75)), repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px); }
.artist-hero .ent { position: relative; }

.two-col { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 24px; margin-bottom: 28px; }
.top-card { background: var(--panel-2); border: 1px solid var(--line); padding: 20px; display: grid; gap: 16px; cursor: pointer; position: relative; transition: background .15s, border-color .15s; min-width: 0; }

.pill { display: inline-block; padding: 4px 10px; background: rgba(0,0,0,.45); border: 1px solid var(--line); font: 12px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; }

.genres { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.genre {

  font: 700 20px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; overflow-wrap: anywhere;
  background: linear-gradient(135deg, hsl(var(--h) 35% 22%), var(--panel-2) 75%);

}
.genre::after { content: ""; position: absolute; right: -10px; bottom: -10px; width: 70px; height: 70px; opacity: .5; background: repeating-linear-gradient(-45deg, hsl(var(--h) 75% 58%) 0 6px, transparent 6px 12px); }
.genre:hover { border-color: hsl(var(--h) 75% 58%); }
.gcode { font: 12px var(--font-mono); letter-spacing: .14em; color: var(--muted); }

.empty { padding: 60px 16px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { margin: 0; color: var(--fg); font: 700 20px var(--font-display); text-transform: uppercase; letter-spacing: .05em; }
.skel { background: linear-gradient(90deg, var(--panel-2), var(--panel-3), var(--panel-2)); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }

/* ---------- Right panel ---------- */
.right { grid-area: right; width: 340px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.rp-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px; gap: 8px; }
.rp-head h3 { margin: 0; font: 700 15px var(--font-display); text-transform: uppercase; letter-spacing: .08em; }
.rp-body { flex: 1; overflow: auto; padding: 0 16px 20px; scrollbar-color: var(--line) transparent; }
.np-art { position: relative; aspect-ratio: 1; max-width: 100%; overflow: hidden; background: var(--panel-3); margin: 8px 0 16px; }
.np-art img { width: 100%; height: 100%; object-fit: cover; }
.np-title { font: 400 24px/1.05 var(--font-stencil); text-transform: uppercase; margin: 0; overflow-wrap: anywhere; }
.np-sub { color: var(--muted); }
.np-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.np-card { background: var(--panel-2); border: 1px solid var(--line); padding: 16px; margin-top: 18px; display: grid; gap: 10px; }
.np-card h4 { margin: 0; font: 12px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.qh { font: 12px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 18px 0 8px; }
.qi { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 6px 8px; cursor: pointer; margin: 0 -8px; }
.qi:hover { background: var(--panel-2); }
.qi .thumb { width: 40px; height: 40px; }
.qi.cur .t { color: var(--accent); }
.qi .t { font-weight: 600; }

.lyrics { font: 700 22px/1.45 var(--font-display); color: var(--dim); display: grid; gap: 6px; padding: 8px 0 40px; }

/* ---------- Player bar ---------- */
.player {

.player::before { content: "NOW PLAYING"; position: absolute; top: -2px; left: 24px; transform: translateY(-100%); background: var(--accent); color: var(--accent-ink); font: 10px/1 var(--font-mono); letter-spacing: .18em; padding: 4px 8px 3px; }

.p-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

.p-left .meta { min-width: 0; cursor: pointer; }

.ctrls { display: flex; align-items: center; gap: 14px; }

.pp {

.seek { display: flex; align-items: center; gap: 10px; width: 100%; font: 12px var(--font-mono); color: var(--muted); }

.p-right { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
.vol { width: 100px; }
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 14px; background: transparent; cursor: pointer; margin: 0; --p: 0%;
}
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(90deg, var(--accent) var(--p), #2c363e var(--p)); }

/* ---------- Tab bar (phone) ---------- */
.tabbar { display: none; }

/* ---------- Menus, modal, toast ---------- */
#menu {
  position: fixed; z-index: 50; min-width: 230px; max-width: min(320px, calc(100vw - 16px)); max-height: 70vh; overflow: auto;

.mhead { padding: 8px 12px 4px; font: 11px var(--font-mono); color: var(--accent); letter-spacing: .14em; text-transform: uppercase; }
#modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(0,0,0,.7); padding: 16px; }
.modal-card { width: 100%; max-width: 440px; border: 1px solid var(--line); padding: 24px; display: grid; gap: 16px; --bl: 18px; }

#sheet {

}
.sh-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.sh-art { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1; margin: 8px auto; overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,.6); background: var(--panel-3); outline: 1px solid rgba(255,122,26,.4); outline-offset: 6px; }

.sh-ctrls .icon-btn { width: 44px; height: 44px; }
.sh-tabs { display: flex; gap: 8px; }

}

  #view { padding: 0 16px 24px; }

  .artist-hero { margin: 0 -16px; padding: 0 16px; min-height: 280px; }
  .two-col { grid-template-columns: minmax(0, 1fr); }
  .tl-head { display: none; }
  .row, .row.noalbum { grid-template-columns: minmax(0, 1fr) 32px 32px; padding: 0 6px; gap: 8px; }
  .row .n, .row .dur { display: none; }
  .row .fav, .row .more { opacity: 1; }
  .player {
    margin: 14px 8px 6px; height: 60px; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px;
    background: color-mix(in srgb, var(--hero) 55%, var(--panel-2)); padding: 0 8px 0 6px;
  }
  .player::before { left: 8px; }
  .p-left .thumb { width: 44px; height: 44px; }
  .p-center, .p-right { display: none; }
  .mini-play { display: grid; width: 40px; height: 40px; }
  .mini-bar { display: block; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.15); }
  .mini-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .tabbar {
    grid-area: tabs; display: grid; grid-template-columns: repeat(3, 1fr);

  .row-scroll { grid-auto-columns: 140px; }

  .qt { height: 52px; } .qt .thumb { width: 52px; height: 52px; } .qt .t { font-size: 12px; }

  #toast { bottom: 150px; }
}

"use strict";
/* ============ utilities ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("so2:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("so2:" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("so2:" + k); } catch {} }
};
const secs = t => (t && t.RunTimeTicks ? t.RunTimeTicks / 1e7 : 0);
function fmt(s) { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; }
function fmtLong(s) { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} hr ${m} min` : `${m} min ${s % 60} sec`; }
const hue = str => { let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function uid() { try { return crypto.randomUUID(); } catch { return Date.now().toString(36) + Math.random().toString(36).slice(2); } }

  if (S && S.token) h += `, Token="${S.token}"`;

}

  let res;

    res = await fetch(url, {
      method,
      headers: { "Authorization": authHeader(), "X-Emby-Authorization": authHeader(), ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined

  } catch (e) {

  }
  if (!server && !ONLINE) setOnline(true);
  if (res.status === 401 && S && S.token && !server) { signOut("Your session ended. Sign in again."); throw new Error("Signed out"); }
  if (!res.ok) { const err = new Error(`The server answered ${res.status}`); err.status = res.status; throw err; }

}

const ORIGINAL = 140000000;
function streamUrls(id) {
  const q = +store.get("quality", ORIGINAL);
  const auth = { ApiKey: S.token, api_key: S.token, DeviceId: deviceId, PlaySessionId: P.session };
  const u = (path, extra) => `${S.server}${path}?${new URLSearchParams({ ...extra, ...auth })}`;
  const direct = u(`/Audio/${id}/stream`, { static: "true" });
  const mp3 = u(`/Audio/${id}/stream.mp3`, { audioCodec: "mp3", audioBitRate: String(Math.min(q, 320000)), audioChannels: "2" });
  const universal = u(`/Audio/${id}/universal`, {
    UserId: S.userId, MaxStreamingBitrate: String(q),
    Container: "opus,webm|opus,mp3,aac,m4a|aac,m4b|aac,flac,webma,webm|webma,wav,ogg",

async function diagnose(urls) {
  const codes = [];
  for (const url of urls) {
    try { const r = await fetch(url, { headers: { Range: "bytes=0-1" } }); codes.push(r.status); }
    catch { codes.push(0); }
  }
  if (codes.every(c => c === 0)) return "this device can't reach the stream address.";
  if (codes.some(c => c === 401 || c === 403)) return "the server refused the stream. Sign out and back in, and check this user is allowed media playback in Jellyfin.";
  if (codes.every(c => c === 404)) return "the file is missing on the server. Rescan your music library in Jellyfin.";
  if (codes.some(c => c >= 500)) return "the server couldn't convert this file. Check FFmpeg under Dashboard > Playback in Jellyfin.";
  if (codes.some(c => c === 200 || c === 206)) return "your browser can't decode this file's format.";
  return `the server answered ${codes.filter(Boolean).join(", ")}.`;
}

const favOverride = new Map();

async function toggleFav(id) {

  favOverride.set(id, next); syncFavs(id);
  const m = next ? "POST" : "DELETE";
  try {
    try { await api(`/UserFavoriteItems/${id}`, { method: m, params: { userId: S.userId } }); }
    catch (e) { if (e.status === 404 || e.status === 405) await api(`/Users/${S.userId}/FavoriteItems/${id}`, { method: m }); else throw e; }
    toast(next ? (it.Type === "Audio" ? "Added to Liked Songs" : "Saved to Your Library") : (it.Type === "Audio" ? "Removed from Liked Songs" : "Removed from Your Library"));
    if (it.Type === "Audio") LIB.likedCount += next ? 1 : -1, renderLib();

  }
}

      items({ IncludeItemTypes: "Playlist", SortBy: "DateCreated", SortOrder: "Descending", Limit: 200 }),
      items({ IncludeItemTypes: "MusicAlbum", SortBy: "DateCreated", SortOrder: "Descending", Limit: 400 }),
      api("/Artists/AlbumArtists", { params: { userId: S.userId, SortBy: "SortName", Limit: 400, Fields: FIELDS } }),
      items({ IncludeItemTypes: "Audio", Filters: "IsFavorite", Limit: 0, EnableTotalRecordCount: true })

    LIB.albums = keepAll(al.Items);
    LIB.artists = keepAll(ar.Items);

  renderLib();

}
function libEntries() {
  const f = LIB.filter, q = LIB.q.trim().toLowerCase();

  if (f === "all" || f === "albums") out.push(...LIB.albums.map(x => ({ it: x, kind: "Album" })));
  if (f === "all" || f === "artists") out.push(...LIB.artists.map(x => ({ it: x, kind: "Artist" })));

/* ============ player ============ */
const audio = new Audio(); audio.preload = "auto";
const P = { base: [], queue: [], idx: -1, added: 0, shuffle: store.get("shuffle", false), repeat: store.get("repeat", "off"), ctxId: null, ctxName: "", ctxRoute: null, session: uid(), reportT: 0, lyrics: null };
audio.volume = store.get("vol", 0.8);
const cur = () => P.queue[P.idx];

function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function playList(tracks, start = 0, ctx = {}) {
  tracks = keepAll(tracks).filter(Boolean);
  if (!ONLINE && !tracks.some(t => DL.has(t.Id))) { toast("You're offline and none of these songs are downloaded.", 4000); return; }
  if (!tracks.length) { toast("There are no songs to play here."); return; }
  reportStop();
  P.base = tracks.slice(); P.added = 0;
  P.ctxId = ctx.id || null; P.ctxName = ctx.name || ""; P.ctxRoute = ctx.route || null;
  if (P.shuffle) {
    const first = start != null && start >= 0 ? tracks[start] : tracks[Math.floor(Math.random() * tracks.length)];
    P.queue = [first, ...shuffled(tracks.filter((t, i) => t !== first))];
    P.idx = 0;
  } else { P.queue = tracks.slice(); P.idx = Math.max(0, start || 0); }
  skipUnavailable(1);
  load(true);
  $$(".li").forEach(el => el.classList.toggle("playing", el.dataset.go && el.dataset.go.endsWith(P.ctxId || "§")));
}
async function load(autoplay) {
  const t = cur(); if (!t) return;
  P.session = uid(); P.lyrics = null;
  const seqNo = P.loadSeq = (P.loadSeq || 0) + 1;
  updateNowUI();
  let local = null;
  if (DL.has(t.Id)) { try { local = await offlineSrc(t.Id); } catch {} }
  if (seqNo !== P.loadSeq) return;
  P.local = !!local;
  P.urls = local ? [local, ...(ONLINE ? streamUrls(t.Id) : [])] : streamUrls(t.Id);
  P.attempt = 0;
  audio.src = P.urls[0];
  if (autoplay) tryPlay();
  reportStart();
  if (panel === "lyrics" || sheetTab === "lyrics") loadLyrics();
}
function skipUnavailable(dir) {
  if (ONLINE || !P.queue.length) return;
  for (let n = 0; n < P.queue.length && !DL.has(P.queue[P.idx].Id); n++) P.idx = (P.idx + dir + P.queue.length) % P.queue.length;
}
function tryPlay() {
  const pr = audio.play();
  if (pr && pr.catch) pr.catch(e => {
    if (e && e.name === "NotAllowedError") toast("Your browser blocked autoplay. Press play to start.", 4000);
  });
}
function toggle() {
  if (!cur()) { const first = $("[data-playctx]"); if (first) first.click(); return; }
  if (audio.paused) tryPlay();
  else audio.pause();
}
function next(auto = false) {
  if (!P.queue.length) return;
  if (auto && P.repeat === "one") { audio.currentTime = 0; audio.play(); return; }
  reportStop();
  if (P.added > 0) P.added--;
  if (P.idx + 1 < P.queue.length) P.idx++;
  else if (P.repeat === "all") P.idx = 0;
  else { if (auto) { P.idx = 0; load(false); audio.pause(); return; } P.idx = 0; }
  skipUnavailable(1);
  load(true);
}
function prev() {
  if (!P.queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  reportStop();
  if (P.idx > 0) P.idx--; else if (P.repeat === "all") P.idx = P.queue.length - 1;
  skipUnavailable(-1);
  load(true);
}
function setShuffle(on) {
  P.shuffle = on; store.set("shuffle", on);
  const c = cur();
  if (c && P.base.length) {
    if (on) { P.queue = [c, ...shuffled(P.base.filter(t => t !== c))]; P.idx = 0; }
    else { P.queue = P.base.slice(); P.idx = Math.max(0, P.queue.indexOf(c)); }
    P.added = 0;
  }
  updateModes(); if (panel === "queue") renderPanel(); if (!$("#sheet").hidden) renderSheet();
}
function cycleRepeat() { P.repeat = P.repeat === "off" ? "all" : P.repeat === "all" ? "one" : "off"; store.set("repeat", P.repeat); updateModes(); if (!$("#sheet").hidden) renderSheet(); }
function addToQueue(t, nextUp) {
  keep(t);

function tintFrom(url, target) {
  const setter = c => {
    if (target === "player") { if (window.innerWidth <= 760) document.documentElement.style.setProperty("--hero", c); const sh = $("#sheet"); if (sh && !sh.hidden) sh.style.setProperty("--hero", c); P.color = c; }

  };
  if (!url) { if (target !== "player") setter(`hsl(${hue(route.id || route.v)} 25% 30%)`); return; }
  const img = new Image(); img.crossOrigin = "anonymous";
  img.onload = () => {
    try {
      const c = document.createElement("canvas"); c.width = c.height = 16;
      const x = c.getContext("2d"); x.drawImage(img, 0, 0, 16, 16);
      const d = x.getImageData(0, 0, 16, 16).data;
      let best = null, bestScore = -1, r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) {

        const mx = Math.max(R, G, B), mn = Math.min(R, G, B), sat = mx ? (mx - mn) / mx : 0, lum = (mx + mn) / 2;
        const score = sat * (lum > 30 && lum < 220 ? 1 : .2);
        if (score > bestScore) { bestScore = score; best = [R, G, B]; }

    } catch { setter(`hsl(${hue(url)} 25% 30%)`); }
  };
  img.onerror = () => setter(`hsl(${hue(url)} 25% 30%)`);

}

const IDB = (() => {
  let dbp = null;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open(`spotiops-ii-${S ? S.userId : "anon"}`, 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => { const db = r.result; ["audio", "meta", "art", "collections"].forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); }); };
      r.onsuccess = () => res(r.result);

    });
    return dbp;
  }
  async function run(store, mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode);
      let out;
      const req = fn(tx.objectStore(store));
      if (req) req.onsuccess = () => { out = req.result; };
      tx.oncomplete = () => res(out);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  }
  return {
    get: (st, k) => run(st, "readonly", s => s.get(k)),
    put: (st, k, v) => run(st, "readwrite", s => s.put(v, k)),
    del: (st, k) => run(st, "readwrite", s => s.delete(k)),
    keys: st => run(st, "readonly", s => s.getAllKeys()),
    all: st => run(st, "readonly", s => s.getAll()),
    clear: st => run(st, "readwrite", s => s.clear()),
    reset() { dbp = null; }
  };
})();

    keys.forEach((k, i) => { META.set(k, vals[i]); DL.add(k); if (!cache.has(k)) keep(vals[i].item); });
    COL.clear();
    (await IDB.all("collections")).forEach(c => { COL.set(c.id, c); if (c.item && c.item.Id && !cache.has(c.item.Id)) keep(c.item); });
    for (const k of await IDB.keys("art")) {
      if (OFFART.has(k)) continue;
      const b = await IDB.get("art", k);
      if (b) OFFART.set(k, URL.createObjectURL(b));

async function dlToggle(id) {

  if (st === "done") {

function cancelDownload(id) {

async function downloadCollection(id) {
  if (!ONLINE) { toast("You're offline. Connect to your server to download."); return; }
  let r;
  try { r = await tracksForOnline(id); } catch { toast("Couldn't load those songs."); return; }
  const tracks = (r.tracks || []).filter(t => t && t.Type === "Audio");
  if (!tracks.length) { toast("There are no songs to download here."); return; }
  if (!(await allowedToDownload(tracks[0].Id))) return;
  let item;
  if (id === "liked") item = { __liked: true, Id: "liked", Name: "Liked Songs", Type: "liked" };
  else item = slim(cache.get(id) || await getItem(id));

  const c = { id, type, item, trackIds: tracks.map(t => t.Id), savedAt: Date.now(), paused: false };
  try { await IDB.put("collections", id, c); } catch { toast("This device won't let Spotiops II store downloads.", 6000); return; }

async function downloadSongs(tracks) {

function enqueue(id, tracks) {
  tracks.filter(t => DL.has(t.Id)).forEach(t => addOwner(t.Id, id));
  const need = tracks.filter(t => !DL.has(t.Id));
  if (!need.length) { refreshDlButtons(); renderLib(); return; }
  const j = DLQ.queue.find(x => x.id === id);
  if (j) { const have = new Set(j.tracks.map(t => t.Id)); j.tracks.push(...need.filter(t => !have.has(t.Id))); }
  else DLQ.queue.push({ id, tracks: need, done: 0, failed: 0 });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch {}
  toast(need.length === 1 ? `Downloading “${need[0].Name}”` : `Downloading ${plural(need.length, "song")}`);

async function runQueue() {
  if (DLQ.active) return;
  while (DLQ.queue.length) {
    const job = DLQ.active = DLQ.queue.shift();
    DLQ.cancel = false; job.done = 0; job.failed = 0;
    refreshDlButtons();
    let stop = "";
    for (const t of job.tracks) {
      if (DLQ.cancel) break;
      try { await saveTrack(keep(t), job.id); }
      catch (e) {
        job.failed++;
        if (e.network) { stop = "Download paused: your server can't be reached."; break; }
        if (e.quota) { stop = "Download stopped: this device is out of space for downloads."; break; }
      }
      job.done++;
      refreshDlButtons(); markDownloaded();
      if (job.done % 5 === 0) renderLib();
    }
    if (stop) toast(stop, 6000);
    else if (!DLQ.cancel) {
      const saved = job.done - job.failed;
      toast(job.failed ? `Downloaded ${plural(saved, "song")}. ${plural(job.failed, "song")} failed.` : `${plural(saved, "song")} ready to play offline`, 4000);
    }
    if (stop) { DLQ.queue = []; break; }

async function syncCollection(id, tracks) {
  const c = COL.get(id);
  if (!c || !ONLINE) return;
  const ids = tracks.map(t => t.Id), idSet = new Set(ids);
  const removed = c.trackIds.filter(t => !idSet.has(t));
  const changed = removed.length || ids.length !== c.trackIds.length;
  c.trackIds = ids;
  if (changed) await IDB.put("collections", id, c).catch(() => {});
  for (const tid of removed) {
    const m = META.get(tid);
    if (!m) continue;
    m.cols = m.cols.filter(x => x !== id);
    if (!m.cols.length) await removeTrackDownload(tid); else await IDB.put("meta", tid, m).catch(() => {});
  }
  const missing = tracks.filter(t => !DL.has(t.Id));
  const busy = (DLQ.active && DLQ.active.id === id) || DLQ.queue.some(j => j.id === id);
  if (missing.length && !c.paused && !busy) enqueue(id, missing);
  else if (removed.length) { renderLib(); refreshDlButtons(); }
}

/* ============ router ============ */
let route = { v: "home" }, back = [], fwd = [], seq = 0;
const lists = new Map(); let listN = 0;
function reg(arr, ctx) { const k = "L" + (++listN); lists.set(k, { arr, ctx }); return k; }

async function render(scroll = 0) {

  $$("[data-nav]").forEach(b => {

    const lbl = k === "home" ? "Home" : k === "search" ? "Search" : "Your Library";

    if (scroll) $("#main").scrollTop = scroll;

/* resolve "play this thing" from a card or header */
async function tracksFor(id) {
  if (id === "downloads") return { tracks: dlTracks(), name: "Downloads", route: "downloads" };
  const c = COL.get(id);
  if (c && !ONLINE) return { tracks: colTracks(c), name: c.item.Name, route: c.type === "liked" ? "liked" : `${c.type}:${id}` };
  try { return await tracksForOnline(id); }
  catch (e) { if (e.network && c) return { tracks: colTracks(c), name: c.item.Name, route: c.type === "liked" ? "liked" : `${c.type}:${id}` }; throw e; }
}
async function tracksForOnline(id) {
  if (id === "liked") return { tracks: (await items({ IncludeItemTypes: "Audio", Filters: "IsFavorite", SortBy: "DateCreated,SortName", SortOrder: "Descending" })).Items, name: "Liked Songs", route: "liked" };
  const it = cache.get(id) || await getItem(id);
  switch (it.Type) {
    case "Audio": return { tracks: [it], name: it.Name };
    case "MusicAlbum": return { tracks: (await items({ ParentId: id, IncludeItemTypes: "Audio", SortBy: "ParentIndexNumber,IndexNumber,SortName" })).Items, name: it.Name, route: `album:${id}` };
    case "Playlist": return { tracks: ((await api(`/Playlists/${id}/Items`, { params: { userId: S.userId, Fields: FIELDS } })).Items || []).filter(t => t.Type === "Audio"), name: it.Name, route: `playlist:${id}` };
    case "MusicArtist": return { tracks: (await items({ ArtistIds: id, IncludeItemTypes: "Audio", SortBy: "PlayCount,Random", SortOrder: "Descending", Limit: 200 })).Items, name: it.Name, route: `artist:${id}` };
    case "MusicGenre": return { tracks: (await items({ GenreIds: id, IncludeItemTypes: "Audio", SortBy: "Random", Limit: 200 })).Items, name: it.Name, route: `genre:${id}` };
    default: return { tracks: [], name: it.Name };
  }
}
async function playCtx(id, forceShuffle) {
  if (P.ctxId === id && cur() && !forceShuffle) { toggle(); return; }
  try {
    const r = await tracksFor(id);
    if (forceShuffle && !P.shuffle) setShuffle(true);
    playList(r.tracks, forceShuffle || P.shuffle ? -1 : 0, { id, name: r.name, route: r.route });
  } catch { toast("Couldn't load those songs. Try again."); }
}
async function startMix(id) {
  try {
    const r = await api(`/Items/${id}/InstantMix`, { params: { userId: S.userId, Limit: 80, Fields: FIELDS } });
    const it = cache.get(id);
    playList(r.Items, 0, { id: "mix:" + id, name: `${it ? it.Name : "Song"} Mix` });
    toast("Mix started");
  } catch { toast("Couldn't start a mix for this one."); }
}

    <div class="muted" style="font-size:12px">Space plays or pauses. Shift + → and Shift + ← skip songs. / jumps to search.</div>
    <div class="modal-actions"><button class="btn ghost" data-act="signout">${icon("logout", 18)}Sign out</button><button class="btn" data-act="closemodal">Done</button></div>`);
  $("#set-q").addEventListener("change", e => { store.set("quality", +e.target.value); toast("Quality applies from the next song"); });
}

/* ============ events ============ */
document.addEventListener("click", async e => {
  const t = e.target;
  if (!$("#menu").hidden && !t.closest("#menu") && !t.closest("[data-menu]")) closeMenu();
  if (t.id === "modal") { closeModal(); return; }

  const fav = t.closest("[data-fav]"); if (fav) { e.stopPropagation(); toggleFav(fav.dataset.fav); if (fav.dataset.close) closeMenu(); return; }
  const pc = t.closest("[data-playctx]"); if (pc) { e.stopPropagation(); playCtx(pc.dataset.playctx); return; }
  const pt = t.closest("[data-play-track]"); if (pt) {
    const cards = $$('.card[data-from="most"]'); const ids = cards.map(c => c.dataset.playTrack);
    playList(ids.map(i => cache.get(i)), Math.max(0, ids.indexOf(pt.dataset.playTrack)), { id: "most", name: "On repeat" }); return;
  }
  const mn = t.closest("[data-menu]"); if (mn) { e.stopPropagation(); if (!$("#menu").hidden && $("#menu").dataset.for === mn.dataset.id + mn.dataset.menu) { closeMenu(); return; } $("#menu").dataset.for = mn.dataset.id + mn.dataset.menu; mn.dataset.menu === "track" ? trackMenu(mn) : entityMenu(mn, mn.dataset.menu); return; }
  const addto = t.closest("[data-addto]"); if (addto) { closeMenu(); addToPlaylist(addto.dataset.addto, addto.dataset.ids.split(",")); return; }
  const lf = t.closest("[data-libf]"); if (lf) { LIB.filter = LIB.filter === lf.dataset.libf && lf.dataset.libf !== "all" ? "all" : lf.dataset.libf; store.set("libFilter", LIB.filter); renderLib(); if (route.v === "library") render(); return; }
  const qi = t.closest("[data-qi]"); if (qi && !t.closest("[data-go]:not([data-qi])")) { const i = +qi.dataset.qi; if (i !== P.idx) playAt(i); return; }
  const st = t.closest("[data-sheettab]"); if (st) { sheetTab = sheetTab === st.dataset.sheettab ? null : st.dataset.sheettab; renderSheet(); return; }
  const ly = t.closest(".lyrics.synced p"); if (ly && ly.dataset.at) { audio.currentTime = +ly.dataset.at; return; }

  const g = t.closest("[data-go]");
  const row = t.closest(".row[data-list]");
  if (g && (!row || g !== row)) {
    if (g.dataset.go.endsWith(":")) return;
    closeMenu();
    if (!$("#sheet").hidden) $("#sheet").hidden = true;
    go(parseGo(g.dataset.go)); return;
  }
  if (row && !t.closest("button")) {
    const L = lists.get(row.dataset.list); if (!L) return;
    const i = +row.dataset.i;
    if (L.ctx.id && P.ctxId === L.ctx.id && cur() && cur().Id === L.arr[i].Id) { toggle(); return; }
    playList(L.arr, i, L.ctx); return;
  }

  const a = t.closest("[data-act]"); if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.act) {
    case "toggle": toggle(); break;
    case "next": next(); break;
    case "prev": prev(); break;
    case "shuffle": setShuffle(!P.shuffle); break;
    case "repeat": cycleRepeat(); break;
    case "mute": audio.muted = !audio.muted; break;
    case "panel": setPanel(a.dataset.panel); break;
    case "closeright": setPanel(panel); break;
    case "back": navBack(); break;
    case "fwd": navFwd(); break;
    case "retry": render(); break;
    case "opensheet": if (window.innerWidth <= 760) openSheet(); else if (cur() && !t.closest(".link")) setPanel("np"); break;
    case "closesheet": $("#sheet").hidden = true; break;
    case "shuffleplay": playCtx(id, true); break;
    case "mix": closeMenu(); startMix(id); break;
    case "qnext": closeMenu(); addToQueue(cache.get(id), true); break;
    case "qadd": closeMenu(); addToQueue(cache.get(id), false); break;
    case "qall": closeMenu(); try { const r = await tracksFor(id); r.tracks.forEach(x => addToQueue(x, false)); toast(`Added ${plural(r.tracks.length, "song")} to queue`); } catch { toast("Couldn't load those songs."); } break;
    case "pickpl": openMenu(a.closest("#menu") ? $("#menu") : a, playlistPicker([id])); break;
    case "dl": closeMenu(); downloadSongs([cache.get(id)]); break;
    case "undl": closeMenu(); await removeTrackDownload(id); toast("Removed from downloads"); afterDlChange(); break;
    case "dltoggle": closeMenu(); dlToggle(id); break;
    case "askremoveall": closeMenu(); confirmModal("Remove all downloads?", "Every downloaded song will be deleted from this device. Nothing changes on your server.", "Remove all", removeAllDownloads); break;
    case "confirmok": { const f = pendingConfirm; pendingConfirm = null; closeModal(); if (f) await f(); break; }
    case "pickplall": try { const r = await tracksFor(id); openMenu($("#menu"), playlistPicker(r.tracks.map(x => x.Id))); } catch {} break;
    case "rmpl": closeMenu(); try { await api(`/Playlists/${a.dataset.pl}/Items`, { method: "DELETE", params: { entryIds: a.dataset.entry } }); toast("Removed from playlist"); render(); } catch { toast("Couldn't remove that song."); } break;
    case "renamepl": closeMenu(); renameModal(id); break;
    case "newpl": closeMenu(); newPlaylistModal(a.dataset.add ? a.dataset.add.split(",") : null); break;
    case "libsort": LIB.sort = LIB.sort === "alpha" ? "recent" : "alpha"; store.set("libSort", LIB.sort); renderLib(); if (route.v === "library") render(); break;
    case "settings": settingsModal(); break;
    case "closemodal": closeModal(); break;
    case "signout": closeModal(); signOut(); break;
  }
});

let qT;
document.addEventListener("input", e => {
  if (e.target.id === "q" || e.target.id === "q-m") {
    if (e.target.id === "q-m") $("#q").value = e.target.value;
    clearTimeout(qT); qT = setTimeout(async () => {
      if (route.v !== "search") { go({ v: "search" }); return; }
      const keepFocus = e.target.id === "q-m", pos = e.target.selectionStart;
      await render();
      if (keepFocus) { const m = $("#q-m"); if (m) { m.focus(); m.setSelectionRange(pos, pos); } }
    }, 280);
  }
  if (e.target.id === "lib-q") { LIB.q = e.target.value; $("#lib-list").innerHTML = libListHTML(); }
  if (e.target.id === "vol") { audio.muted = false; audio.volume = e.target.value / 100; store.set("vol", audio.volume); }
});
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName);
  if (e.key === "Escape") { closeMenu(); closeModal(); if (!$("#sheet").hidden) $("#sheet").hidden = true; return; }
  if (typing || $("#app").hidden) return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.shiftKey && e.key === "ArrowRight") next();
  else if (e.shiftKey && e.key === "ArrowLeft") prev();
  else if (e.key === "ArrowRight" && cur()) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  else if (e.key === "ArrowLeft" && cur()) audio.currentTime = Math.max(0, audio.currentTime - 5);
  else if (e.key === "/") { e.preventDefault(); if (route.v !== "search") go({ v: "search" }); setTimeout(() => ($("#q-m") || $("#q")).focus(), 50); }
});
$("#main").addEventListener("scroll", () => $("#topbar").classList.toggle("solid", $("#main").scrollTop > 60), { passive: true });
window.addEventListener("beforeunload", reportStop);

/* ============ sign-in ============ */
function signOut(msg) {
  if (S && S.token) api("/Sessions/Logout", { method: "POST" }).catch(() => {});
  audio.pause(); audio.removeAttribute("src");
  const server = S && S.server, user = S && S.userName;
  S = null; store.del("session");
  if (NATIVE) try { NATIVE.stopped(); } catch {}
  resetOffline();
  P.queue = []; P.idx = -1;
  showLogin(server, user, msg);
}
function showLogin(server, user, msg) {
  $("#app").hidden = true; $("#sheet").hidden = true; $("#login").hidden = false;
  document.title = "Spotiops II";
  $("#f-server").value = server || store.get("lastServer", "");
  $("#f-user").value = user || store.get("lastUser", "");
  $("#login-err").textContent = msg || "";
  ($("#f-server").value ? $("#f-user").value ? $("#f-pass") : $("#f-user") : $("#f-server")).focus();
}
$("#login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("#login-err"), btn = $("#login-btn"); err.textContent = "";
  const raw = $("#f-server").value, user = $("#f-user").value.trim(), pw = $("#f-pass").value;
  if (!raw.trim()) { err.textContent = "Enter your Jellyfin server address, for example http://192.168.1.20:8096"; return; }
  if (!user) { err.textContent = "Enter your username."; return; }
  const server = normServer(raw);
  if (!NATIVE && location.protocol === "https:" && server.startsWith("http:")) { err.textContent = "This page is loaded over https, so the browser blocks an http server. Use your server's https address, or open Spotiops II from a file or http address."; return; }
  btn.disabled = true; btn.textContent = "Connecting…";
  try {
    let info = null;
    try { info = await api("/System/Info/Public", { server }); } catch (x) { if (x.network) throw x; }
    const r = await api("/Users/AuthenticateByName", { method: "POST", body: { Username: user, Pw: pw }, server });
    S = { server, token: r.AccessToken, userId: r.User.Id, userName: r.User.Name, serverName: (info && info.ServerName) || r.ServerId || "" };
    store.set("session", S); store.set("lastServer", server); store.set("lastUser", user);
    $("#f-pass").value = ""; startApp();
  } catch (x) {
    err.textContent = x.network
      ? "Couldn't reach that server. Check the address and port, and that this device is on the same network (or the server is reachable from the internet)."
      : x.status === 401 ? "Wrong username or password." : `Sign-in failed: ${x.message}.`;
  } finally { btn.disabled = false; btn.textContent = "Connect"; }
});

function startApp() {
  $("#login").hidden = true; $("#app").hidden = false;
  $("#avatar").textContent = (S.userName || "?")[0].toUpperCase();
  $("#uplink").textContent = `Linked · ${S.serverName || new URL(S.server).host}`;
  $("#nav-back").innerHTML = icon("back", 18); $("#nav-fwd").innerHTML = icon("fwd", 18);
  $("#sb-ic").innerHTML = icon("search", 20); $("#lib-search-ic").innerHTML = icon("search", 16);
  $("#lib-title").innerHTML = icon("library", 22) + "Your Library";
  $(".lib-head .icon-btn").innerHTML = icon("plus", 18);
  $("#rp-close").innerHTML = icon("close", 18);
  $("#b-prev").innerHTML = icon("prev", 18); $("#b-next").innerHTML = icon("next", 18);
  $("#b-np").innerHTML = icon("np", 18); $("#b-lyrics").innerHTML = icon("lyrics", 18); $("#b-queue").innerHTML = icon("queue", 18);
  $("#p-art").innerHTML = `<div class="ph">${icon("album", 22)}</div>`;
  setRange($("#vol"), audio.volume * 100); setRange($("#seek"), 0);
  $("#b-mute").innerHTML = icon("vol", 18);
  updateModes(); updatePlayState();
  $("#right").hidden = !panel; ["np", "lyrics", "queue"].forEach(k => $("#b-" + k).classList.toggle("on", panel === k)); if (panel) renderPanel();
  back = []; fwd = []; route = { v: "home" };
  ONLINE = true;
  offlineReady = loadOffline();
  renderLib(); render(); loadLibrary();
}
window.addEventListener("online", () => { if (S && !ONLINE) { loadLibrary(); render(); } });
bindSeek($("#seek"));
$("#lib-q").value = "";

if (S && S.token) startApp(); else showLogin();
</script>
</body>
