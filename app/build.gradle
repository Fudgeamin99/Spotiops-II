plugins {
    id 'com.android.application'
}

def buildNumber = (project.findProperty('buildNumber') ?: '1') as Integer

android {
    namespace 'com.spotiops.two'
    compileSdk 34

    defaultConfig {
        applicationId 'com.spotiops.two'
        minSdk 24
        targetSdk 34
        // GitHub passes its run number, so every build counts up and can update the last one.
        versionCode buildNumber
        versionName "2.0.${buildNumber}"
    }

    signingConfigs {
        // One fixed key for every build. Android only installs an update signed with the same key.
        spotiops {
            storeFile rootProject.file('signing/spotiops-ii.keystore')
            storePassword 'spotiops-ii'
            keyAlias 'spotiops'
            keyPassword 'spotiops-ii'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.spotiops
        }
        debug {
            signingConfig signingConfigs.spotiops
        }
    }

    lint {
        // Don't let Play Store policy checks block a sideloaded build.
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
