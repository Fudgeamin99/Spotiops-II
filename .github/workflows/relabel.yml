name: One-off relabel

# Marks every build before build 12 as a beta pre-release.
# Runs once when the relabel-run branch is created; this file is deleted straight after.
on:
  create:

permissions:
  contents: write

jobs:
  relabel:
    if: github.ref == 'refs/heads/relabel-run'
    runs-on: ubuntu-latest
    steps:
      - name: Relabel builds before 12 as beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            n="${tag#build-}"
            case "$n" in ''|*[!0-9]*) continue;; esac
            if [ "$n" -lt 12 ]; then
              gh release edit "$tag" --prerelease --latest=false \
                --title "Spotiops II beta (build $n)" \
                --notes "Beta build of Spotiops II. For the current version, install the latest official release."
              echo "relabelled $tag"
            fi
          done
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/relabel-run" || true
          gh release list --limit 20
