name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SpotiopsII.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpotiopsII-apk
          path: out/SpotiopsII.apk

      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/SpotiopsII.apk \
            --title "Spotiops II (build ${{ github.run_number }})" \
            --notes "Download SpotiopsII.apk below and open it on your phone to install." \
            --latest
